name: Deploy to GitHub Pages

# 只在 main 上跑。功能分支的測試與校準由 ci.yml 負責（它會在 PR 上跑），
# 從這裡再跑一次只是重複燒 CI 時間——deploy job 本來就擋在 main 之外。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來就取消排隊中的舊的（但不中斷進行中的）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # city pack 已經 commit 在 public/ 裡，這裡重建一次確保它跟目前的
      # 參數與腳本一致（build:pack 只讀 data/sources/，不需要連外網路）
      - run: npm run build:pack

      - run: npm test

      # 模擬器對照真實台北捷運的校準檢查。算錯了就不該部署出去。
      - run: npm run calibrate

      - run: npm run build

      # 需要先在 repo 的 Settings → Pages 把 Source 設成「GitHub Actions」。
      # 這一步無法由 workflow 自動完成：GITHUB_TOKEN 沒有建立 Pages site 的權限
      # （會得到 "Resource not accessible by integration"），只能由 repo 擁有者手動開一次。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 順便產一份單檔版：整個遊戲內嵌成一個 HTML，下載後直接雙擊就能玩，
      # 不需要伺服器也不需要網路。
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: dist-single/index.html

  # 只從預設分支部署。github-pages 這個環境在啟用 Pages 時會自動建立，
  # 預設只允許預設分支部署到它；從功能分支跑，deploy job 會在還沒開始執行前
  # 就被擋掉（狀態是 failure、而且完全沒有 log，很難查）。
  # 功能分支仍然會跑上面的測試與校準，只是不部署。
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
